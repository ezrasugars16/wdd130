<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Travel to plan your next white water adventure or get answers to your questions.">
    <meta name="author" content="Ezra Dave Ignacio">
    <title>Contact Us at Rafting Travel Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/rafting-icon.jpg" alt="rafting website logo">

        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-heading">
            <h1>White Water Rafting Company</h1>
            <address>
                <strong>123 Feliza Street</strong><br>
                Valenzuela City, Philippines<br>
                +1 999 999 9999<br>
                info@whitewater.com

            </address>
        </section>

        <section class="contact-content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30871.154950251694!2d120.97724413652345!3d14.718563616681875!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1790835223278!5m2!1sen!2sph"
                  width="400px" height="400px" allowfullscreen="" loading=" lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="contact-form">
                <form>
                    <div class="form-item column1">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Your name"
                          required>
                    </div>

                    <div class="form-item column1">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email"
                          required>
                    </div>

                    <fieldset>
                        <p>Message Purpose</p>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-item message-item">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here" required></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter" value="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Employee profile 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Employee profile 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Employee profile 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>©️ 2026 🌊 Ezra Dave Ignacio 🌊 Valenzuela, Philippines.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.png" alt="facebook icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-bw.png" alt="youtube icon">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tictok-bw.png" alt="tiktok icon">
            </a>
        </nav>
    </footer>
</body>

</html>
